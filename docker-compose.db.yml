# ============================================
# AlikoHub Infrastructure - Database & Queue Only
# ============================================
# Localhost bound (127.0.0.1) for secure access by host PM2 microservices.
# Usage:
#   npm run infra:up    (docker compose -f docker-compose.db.yml up -d)
#   npm run infra:down  (docker compose -f docker-compose.db.yml down)

services:
  postgres:
    image: postgres:15-alpine
    container_name: alikohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alikohub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${DB_NAME:-alikohub_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alikohub} -d ${DB_NAME:-alikohub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: alikohub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

volumes:
  postgres_data:
    name: home-project_postgres_data
    external: true
  rabbitmq_data:
    name: home-project_rabbitmq_data
    external: true
