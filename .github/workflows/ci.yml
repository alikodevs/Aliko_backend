name: Monorepo CI

on:
  push:
    branches: [ main, from-vps ]
  pull_request:
    branches: [ main, from-vps ]

jobs:
  validate:
    name: Build and Validate Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Clients
        run: npm run prisma:generate:all

      - name: Build All Services
        run: npx nx run-many --target=build --all
        env:
          NX_DAEMON: false
          NX_TUI: false
          CI: true

      - name: Run Tests
        run: npx nx run-many --target=test --all --passWithNoTests
        env:
          NX_DAEMON: false
          NX_TUI: false
          CI: true
