name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  NX_DAEMON: 'false'
  CI: 'true'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Clients
        run: |
          npx prisma generate --schema=apps/user-service/prisma/schema.prisma
          npx prisma generate --schema=apps/academy-service/prisma/schema.prisma
          npx prisma generate --schema=apps/contech-service/prisma/schema.prisma
          npx prisma generate --schema=apps/events-service/prisma/schema.prisma
          npx prisma generate --schema=apps/careers-service/prisma/schema.prisma
          npx prisma generate --schema=apps/financial-service/prisma/schema.prisma

      - name: Run Tests
        run: npx nx run-many --target=test --all --passWithNoTests

      - name: Build All Services
        run: npx nx run-many --target=build --all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Build
        run: docker compose -f docker-compose.prod.yml build
