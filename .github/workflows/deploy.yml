name: Monorepo CD

on:
  push:
    branches: [ main, from-vps ]
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            dockerfile: infra/docker/Dockerfile.api-gateway
            image: alikohub-api-gateway
          - name: user-service
            dockerfile: infra/docker/Dockerfile.user-service
            image: alikohub-user-service
          - name: academy-service
            dockerfile: infra/docker/Dockerfile.academy-service
            image: alikohub-academy-service
          - name: contech-service
            dockerfile: infra/docker/Dockerfile.contech-service
            image: alikohub-contech-service
          - name: events-service
            dockerfile: infra/docker/Dockerfile.events-service
            image: alikohub-events-service
          - name: careers-service
            dockerfile: infra/docker/Dockerfile.careers-service
            image: alikohub-careers-service
          - name: financial-service
            dockerfile: infra/docker/Dockerfile.financial-service
            image: alikohub-financial-service
          - name: communication-service
            dockerfile: infra/docker/Dockerfile.communication-service
            image: alikohub-communication-service
          - name: storage-service
            dockerfile: infra/docker/Dockerfile.storage-service
            image: alikohub-storage-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST || secrets.VPS_IP || secrets.HOST || '116.203.122.210' }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD || secrets.SSH_PASSWORD || secrets.PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ -d "/root/Home-Project" ]; then
              cd /root/Home-Project
            elif [ -d "/root/Aliko_backend" ]; then
              cd /root/Aliko_backend
            fi
            git pull origin ${{ github.ref_name }}
            bash scripts/deploy.sh
