version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aliko_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: user_db,academy_db,contech_db,events_db,careers_db,financial_db,communication_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - aliko-network

  redis:
    image: redis:7-alpine
    container_name: aliko_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - aliko-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aliko_rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - aliko-network

  user-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.user-service
    container_name: aliko_user_service_prod
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL_USER: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  academy-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.academy-service
    container_name: aliko_academy_service_prod
    restart: always
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL_ACADEMY: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/academy_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      USER_SERVICE_INTERNAL_URL: http://user-service:3001/api/v1
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  contech-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.contech-service
    container_name: aliko_contech_service_prod
    restart: always
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL_CONTECH: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/contech_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  events-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.events-service
    container_name: aliko_events_service_prod
    restart: always
    environment:
      PORT: 3004
      NODE_ENV: production
      DATABASE_URL_EVENTS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/events_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  careers-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.careers-service
    container_name: aliko_careers_service_prod
    restart: always
    environment:
      PORT: 3005
      NODE_ENV: production
      DATABASE_URL_CAREERS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/careers_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  financial-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.financial-service
    container_name: aliko_financial_service_prod
    restart: always
    environment:
      PORT: 3006
      NODE_ENV: production
      DATABASE_URL_FINANCIAL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  communication-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.communication-service
    container_name: aliko_communication_service_prod
    restart: always
    environment:
      PORT: 3007
      NODE_ENV: production
      DATABASE_URL_COMMUNICATION: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/communication_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - aliko-network

  storage-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.storage-service
    container_name: aliko_storage_service_prod
    restart: always
    environment:
      PORT: 3008
      NODE_ENV: production
      LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - storage_uploads:/app/uploads
    networks:
      - aliko-network

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api-gateway
    container_name: aliko_api_gateway_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      USER_SERVICE_URL: http://user-service:3001
      ACADEMY_SERVICE_URL: http://academy-service:3002
      CONTECH_SERVICE_URL: http://contech-service:3003
      EVENTS_SERVICE_URL: http://events-service:3004
      CAREERS_SERVICE_URL: http://careers-service:3005
      FINANCIAL_SERVICE_URL: http://financial-service:3006
      COMMUNICATION_SERVICE_URL: http://communication-service:3007
      STORAGE_SERVICE_URL: http://storage-service:3008
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-aliko-internal-secret}
    depends_on:
      - user-service
      - academy-service
      - contech-service
      - events-service
      - careers-service
      - financial-service
      - communication-service
      - storage-service
    networks:
      - aliko-network

networks:
  aliko-network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  rabbitmq_data_prod:
  storage_uploads:
